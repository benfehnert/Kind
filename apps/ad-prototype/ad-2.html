<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kind — Ad Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Onest:wght@700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="ad-viewport">

    <div id="bg">
      <img id="bg-img" src="" alt="" />
    </div>

    <div id="content">
      <div id="logo">kind</div>
      <div id="logo-sub">health exploration</div>

      <div id="hero-text">
        Your health journey<br><strong>is unique.</strong>
      </div>

      <div id="mockup">
        <img id="mockup-frame" src="" alt="" />
        <img id="screenshot" src="" alt="App screenshot" />
      </div>
    </div>

    <div id="detail-text">
      <div id="detail-tagline">Understand what actually works for <em>you.</em></div>
      <div id="detail-body">Kind matches you with structured health explorations, and supports you through them.</div>
      <div id="detail-cta">Get early access</div>
    </div>

  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
