<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kind — Ad 1B (message-first)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Onest:wght@700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="ad-viewport">

    <div id="bg">
      <img id="bg-img" src="" alt="" />
    </div>

    <div id="logo-block">
      <div id="logo">kind</div>
      <div id="logo-sub">health exploration</div>
    </div>

    <div id="content">
      <div id="message">
        <div id="hero-line">Explore your health</div>
        <div id="hero-sub">backed by science</div>
      </div>

      <div id="mockup">
        <img id="mockup-frame" src="" alt="" />
        <img id="screenshot" src="" alt="App screenshot" />
      </div>
    </div>

    <div id="cta-wrap"><div id="cta">Get early access</div></div>

  </div>

  <script type="module" src="/src/ad-1b.js"></script>
</body>
</html>
