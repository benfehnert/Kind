<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kind Health Exploration Reports — Time Restricted Eating</title>
  <style>
    :root {
      --accent: __ACCENT__;
      --surface: __SURFACE__;
      --text: #1F2A1F;
      --muted: #5F6B5C;
      --border: #E2E6DA;
      --tile-bg: __SURFACE__;
      --card-bg: #FFFFFF;
      --success: #0F6E56;
      --info-bg: #E6F1FB;
      --info-text: #185FA5;
    }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text); margin: 0; background: #fff; }
    .page { page-break-after: always; padding: 22mm 16mm; min-height: 255mm; }
    .page:last-child { page-break-after: auto; }
    .header { background: var(--accent); color: #fff; padding: 16px 20px; border-radius: 12px; margin-bottom: 18px; }
    .header h1 { margin: 0 0 4px; font-size: 21px; }
    .header p { margin: 0; opacity: 0.92; font-size: 13px; }
    .badge { display: inline-block; background: rgba(255,255,255,0.15); padding: 4px 10px; border-radius: 999px; font-size: 11px; margin-top: 8px; }
    .headline { font-size: 16px; line-height: 1.5; margin: 0 0 16px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    .card h2 { font-size: 14px; margin: 0 0 6px; font-weight: 600; }
    .card .sub { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .tile { background: var(--tile-bg); border-radius: 12px; padding: 12px 14px; }
    .tile-label { font-size: 11px; color: var(--muted); line-height: 1.35; }
    .tile-value { font-size: 19px; font-weight: 700; margin: 4px 0; }
    .tile-delta { font-size: 11px; color: var(--success); font-weight: 600; }
    .tile-note { font-size: 10px; color: var(--muted); margin-top: 2px; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th, td { border-bottom: 1px solid var(--border); padding: 7px 6px; text-align: left; vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .bar-row { margin: 10px 0 14px; }
    .bar-label { font-size: 12px; display: flex; justify-content: space-between; margin-bottom: 4px; gap: 8px; }
    .bar-track { height: 8px; background: var(--tile-bg); border-radius: 6px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 6px; }
    .rule-badge { display: inline-block; margin-top: 5px; font-size: 10px; padding: 2px 8px; border-radius: 6px; }
    .chart-svg { width: 100%; height: auto; display: block; margin-top: 8px; }
    .chart-legend { font-size: 10px; color: var(--muted); margin-top: 6px; }
    .dist-strip { display: flex; height: 14px; border-radius: 6px; overflow: hidden; margin: 6px 0 12px; }
    .dist-seg { height: 100%; }
    .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 10px; color: var(--muted); margin-top: 8px; }
    .legend span { display: inline-flex; align-items: center; gap: 4px; }
    .swatch { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
    .pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
    .keep-pill { font-size: 12px; padding: 5px 12px; border-radius: 8px; background: __KEEP_PILL_BG__; color: __KEEP_PILL_TEXT__; font-weight: 500; }
    .info-card { background: var(--info-bg); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    .info-title { font-size: 13px; font-weight: 600; color: var(--info-text); margin: 0 0 6px; }
    .info-body { font-size: 13px; line-height: 1.55; color: var(--info-text); margin: 0; }
    .body-text { font-size: 13px; line-height: 1.55; color: var(--muted); margin: 0; }
    .limitations-block { background: #F8F9F5; border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; }
    .limitations-block h3 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 8px; }
    .limitations-block ul { margin: 0; padding-left: 18px; font-size: 11px; line-height: 1.5; color: var(--muted); }
    .limitations-block li { margin-bottom: 5px; }
    .limitations-block .generalisability { margin: 10px 0 0; padding-top: 10px; border-top: 1px solid var(--border); font-size: 11px; line-height: 1.5; color: var(--muted); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script id="report-data" type="application/json">__REPORT_DATA__</script>
  <script>
    const data = JSON.parse(document.getElementById('report-data').textContent);
    const root = document.getElementById('root');
    const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    const HABIT_LABELS = {
      window_10h_or_less: 'Consistent 10-hour window',
      first_meal_around_8am: 'Fixed first meal (~8am)',
      last_meal_before_6pm: 'Last meal before 6pm'
    };

    function esc(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function energyValue(p) {
      return p.dailyEnergy ?? p.afternoonEnergy ?? 0;
    }

    function renderWindowChart(chart, showDelta) {
      if (!chart?.points?.length) return '<p class="body-text">Not enough logged days to chart eating window and daily energy yet.</p>';
      const vals = chart.points.map(p => showDelta ? (p.changeFromBaseline ?? 0) : energyValue(p));
      const maxV = Math.max(...vals, showDelta ? 0.5 : 5);
      const minV = Math.min(...vals, showDelta ? -0.5 : 4);
      const range = Math.max(maxV - minV, 0.5);
      const W = 520, H = 200, padL = 120, padR = 20, padT = 20, padB = 44;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;
      const barW = plotW / chart.points.length * 0.55;
      const bars = chart.points.map((p, i) => {
        const v = showDelta ? (p.changeFromBaseline ?? 0) : energyValue(p);
        const h = Math.max(4, ((v - minV) / range) * plotH);
        const x = padL + (i + 0.5) * (plotW / chart.points.length) - barW / 2;
        const y = padT + plotH - h;
        const fill = showDelta ? (v >= 0 ? accentColor : '#E24B4A') : accentColor;
        const valLabel = showDelta ? ((v >= 0 ? '+' : '') + Number(v).toFixed(1) + ' pts') : Number(v).toFixed(1);
        return `<rect x="${x}" y="${y}" width="${barW}" height="${h}" fill="${fill}" rx="3"/>
          <text x="${x + barW/2}" y="${H - 8}" font-size="9" fill="#5F6B5C" text-anchor="middle">${esc(p.label)}</text>
          <text x="${x + barW/2}" y="${y - 4}" font-size="9" fill="#1F2A1F" text-anchor="middle" font-weight="600">${valLabel}</text>`;
      }).join('');
      const yLabel = showDelta ? 'Change from Baseline (points)' : (chart.yAxisLabel || 'Average daily energy');
      const baselineLine = !showDelta && chart.baselineReference != null
        ? `<line x1="${padL}" y1="${padT + plotH - ((chart.baselineReference - minV)/range)*plotH}" x2="${W-padR}" y2="${padT + plotH - ((chart.baselineReference - minV)/range)*plotH}" stroke="#888780" stroke-dasharray="4 3"/>
           <text x="${padL - 6}" y="${padT + plotH - ((chart.baselineReference - minV)/range)*plotH + 3}" font-size="8" fill="#888780" text-anchor="end">Baseline ${chart.baselineReference}</text>`
        : '';
      return `<div class="card"><h2>${esc(chart.title)}</h2><p class="sub">${esc(chart.subtitle)}</p>
        <svg class="chart-svg" viewBox="0 0 ${W} ${H}">${baselineLine}${bars}
          <text x="${padL - 8}" y="${padT - 4}" font-size="9" fill="#888780">${esc(yLabel)}</text>
        </svg>
        <div class="chart-legend">${esc(chart.xAxisLabel)} · ${chart.points.map(p => p.daysLogged + ' days at ' + p.label.toLowerCase()).join(' · ')}</div>
      </div>`;
    }

    function renderHabitUpliftChart(chart) {
      if (!chart?.points?.length) return '';
      const maxAbs = Math.max(...chart.points.map(p => Math.abs(p.changeInDailyEnergy ?? p.changeInAfternoonEnergy ?? 0)), 0.5);
      return `<div class="card"><h2>${esc(chart.title)}</h2><p class="sub">${esc(chart.subtitle)}</p>
        ${chart.points.map(p => {
          const delta = p.changeInDailyEnergy ?? p.changeInAfternoonEnergy ?? 0;
          const w = Math.max(8, Math.round((Math.abs(delta) / maxAbs) * 100));
          const val = (delta >= 0 ? '+' : '') + Number(delta).toFixed(1);
          return `<div class="bar-row"><div class="bar-label"><span>${esc(p.label)}</span><strong>${val} points</strong></div>
            <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${accentColor}"></div></div>
            <div class="chart-legend">${p.daysFollowed} days followed · ${p.daysNotFollowed} days not followed</div></div>`;
        }).join('')}
      </div>`;
    }

    function getWindowChart(r) {
      return r.window_energy_chart ?? r.morning_rules_energy_chart;
    }

    function getHabitChart(r) {
      return r.habit_uplift_chart ?? r.rule_uplift_chart;
    }

    function renderBaseline(r) {
      return `<div class="page">
        <div class="header"><h1>${esc(r.reportTitle || 'Baseline summary report')}</h1>
          <p>${esc(r.explorationLabel || 'Health exploration')} · Metabolic Health · Time-restricted eating</p>
          <span class="badge">${esc(r.phaseLabel || 'Baseline')} complete</span></div>
        <p class="headline">${esc(r.headline)}</p>
        <div class="tiles">
          <div class="tile"><div class="tile-label">Baseline days logged</div><div class="tile-value">${r.primary_baseline?.n ?? '—'}</div></div>
          <div class="tile"><div class="tile-label">Average daily energy (0–10 scale)</div><div class="tile-value">${r.primary_baseline?.mean?.toFixed?.(1) ?? '—'}/10</div></div>
          <div class="tile"><div class="tile-label">Typical eating window</div><div class="tile-value">${r.eating_window_mean_hours != null ? Math.round(r.eating_window_mean_hours) + ' hours' : '—'}</div></div>
          <div class="tile"><div class="tile-label">Logging adherence</div><div class="tile-value">${r.adherence?.logging_pct ?? '—'}%</div></div>
        </div>
        <div class="card"><h2>What happens next</h2><p class="body-text">${esc(r.phase_b_guidance)}</p></div>
      </div>`;
    }

    function renderInterim(r) {
      const habitRows = Object.entries(r.habit_energy ?? {}).map(([k,v]) =>
        `<tr><td>${esc(HABIT_LABELS[k] || k)}</td><td>${esc(v.status)}</td><td>${v.difference != null ? (v.difference >= 0 ? '+' : '') + v.difference.toFixed(1) + ' points' : '—'}</td><td>${v.followed_n ?? '—'} followed · ${v.not_followed_n ?? '—'} not</td></tr>`
      ).join('');
      return `<div class="page">
        <div class="header"><h1>${esc(r.reportTitle || 'Health exploration interim report')}</h1>
          <p>End of ${esc(r.phaseLabel || '10-hour window')} · ${esc(r.explorationLabel || 'Health exploration')}</p>
          <span class="badge">Compared with Baseline</span></div>
        <p class="headline">${esc(r.headline)}</p>
        <div class="tiles">${(r.summary_tiles || []).map(t => `<div class="tile"><div class="tile-label">${esc(t.label)}</div><div class="tile-value">${esc(t.value)}</div><div class="tile-note">${esc(t.note)}</div></div>`).join('')}</div>
        ${renderWindowChart(getWindowChart(r), false)}
        ${renderWindowChart(getWindowChart(r), true)}
        ${renderHabitUpliftChart(getHabitChart(r))}
        <div class="card"><h2>Guidance for 8-hour window trial</h2><p class="body-text">${esc(r.optimise_guidance)}</p>
          <p class="body-text"><strong>Focus timing habits:</strong> ${(r.optimise_habit_labels ?? []).map(esc).join(' · ') || '—'}</p></div>
        <div class="card"><h2>Each timing habit and daily energy</h2>
          <table><thead><tr><th>Timing habit</th><th>Status</th><th>Change in daily energy</th><th>Days logged</th></tr></thead><tbody>${habitRows}</tbody></table>
        </div>
        <div class="card"><h2>How to read these results</h2><ul class="limitations-block" style="list-style:disc;padding-left:18px;font-size:11px;color:#5F6B5C;">${(r.limitations ?? []).map(l => `<li style="margin-bottom:5px;">${esc(l)}</li>`).join('')}</ul></div>
      </div>`;
    }

    function renderOptimise(r) {
      return `<div class="page">
        <div class="header"><h1>${esc(r.reportTitle || '8-hour window completion report')}</h1>
          <p>End of ${esc(r.phaseLabel || '8-hour window')} · ${esc(r.explorationLabel || 'Health exploration')}</p></div>
        <p class="headline">${esc(r.headline)}</p>
        <div class="tiles">
          <div class="tile"><div class="tile-label">Average daily energy (0–10 scale)</div><div class="tile-value">${r.optimise_energy?.mean?.toFixed?.(1) ?? r.output_energy?.mean?.toFixed?.(1) ?? '—'}/10</div></div>
        </div>
        <div class="card"><h2>${esc(r.keep_list?.title || 'Your keep list')}</h2>
          <div class="pill-row">${(r.keep_list?.items ?? r.confirmed_keep_labels ?? []).map(i => `<span class="keep-pill">${esc(i)}</span>`).join('')}</div>
          <p class="body-text">${esc(r.keep_list?.body || '')}</p></div>
      </div>`;
    }

    function renderFinal(m) {
      const factors = (m.factors?.rows ?? []).map(row => `
        <div class="bar-row">
          <div class="bar-label"><span>${esc(row.icon)} ${esc(row.label)}</span><strong>${esc(row.value)} points</strong></div>
          <div class="bar-track"><div class="bar-fill" style="width:${row.width}%;background:${row.bar}"></div></div>
          <span class="rule-badge" style="background:${row.badgeBg};color:${row.badgeText}">${esc(row.badge)}</span>
        </div>`).join('');
      const dist = (bars) => `<div class="dist-strip">${(bars ?? []).map(b => `<div class="dist-seg" style="width:${Math.max(b.w,1)}%;background:${b.c}"></div>`).join('')}</div>`;
      const disclaimer = typeof m.disclaimer === 'string' ? { title: 'Hold this lightly', body: m.disclaimer } : (m.disclaimerInfo || m.disclaimer || {});
      const windowChart = m.window_energy_chart ?? m.morning_rules_energy_chart;
      return `<div class="page">
        <div class="header"><h1>${esc(m.reportTitleLabel)}</h1>
          <p>${esc(m.explorationName)} · ${esc(m.category)} · ${esc(m.explorationLabel || 'Health exploration')}</p>
          <span class="badge">${esc(m.subMeta)}</span></div>
        <p class="headline">${esc(m.lede)}</p>
        <div class="tiles">${(m.tiles ?? []).map(t => `<div class="tile"><div class="tile-label">${esc(t.label)}</div><div class="tile-value">${esc(t.value)}</div><div class="tile-delta">${esc(t.delta)}</div></div>`).join('')}</div>
        <div class="card"><h2>${esc(m.phaseChart?.title)}</h2>
          <table><thead><tr><th>Health exploration phase</th><th>Average daily energy (0–10 scale)</th></tr></thead><tbody>
            ${(m.phaseChart?.points ?? []).map(p => `<tr><td>${esc(p.label)}</td><td>${p.v}</td></tr>`).join('')}
          </tbody></table>
        </div>
        ${renderWindowChart(windowChart, false)}
        ${renderWindowChart(windowChart, true)}
        <div class="card"><h2>${esc(m.factors?.title)}</h2><p class="sub">${esc(m.factors?.sub)}</p>${factors}</div>
        <div class="card"><h2>${esc(m.distribution?.title)}</h2>
          <p class="sub"><strong>${esc(m.distribution?.beforeLabel)}</strong></p>${dist(m.distribution?.before)}
          <p class="sub"><strong>${esc(m.distribution?.afterLabel)}</strong></p>${dist(m.distribution?.after)}
          <div class="legend">${(m.distribution?.legend ?? []).map(l => `<span><span class="swatch" style="background:${l.c}"></span>${esc(l.label)}</span>`).join('')}</div>
        </div>
        <div class="card"><h2>🔖 ${esc(m.keepList?.title || 'Your keep list')}</h2>
          <div class="pill-row">${(m.keepList?.items ?? []).map(i => `<span class="keep-pill">${esc(i)}</span>`).join('')}</div>
          <p class="body-text">${esc(m.keepList?.body)}</p></div>
        <div class="card"><h2>${esc(m.compare?.title || 'How you compare')}</h2><p class="body-text">${esc(m.compare?.body)}</p></div>
        <div class="info-card"><p class="info-title">ⓘ ${esc(disclaimer.title || 'Hold this lightly')}</p><p class="info-body">${esc(disclaimer.body || disclaimer)}</p></div>
        ${(m.limitations?.length || m.generalisabilityNote) ? `<div class="limitations-block">
          <h3>Important limitations</h3>
          ${m.limitations?.length ? `<ul>${m.limitations.map(l => `<li>${esc(l)}</li>`).join('')}</ul>` : ''}
          ${m.generalisabilityNote ? `<p class="generalisability">${esc(m.generalisabilityNote)}</p>` : ''}
        </div>` : ''}
      </div>`;
    }

    function renderKindComparison(r) {
      if (r.suppressed) return '';
      const hc = r.habit_comparison || r.rule_comparison || {};
      return `<div class="page">
        <div class="header"><h1>${esc(r.reportTitle || 'Kind comparison')}</h1>
          <p>Week ${r.week} · ${r.kind_community_size ?? r.cohort_size} kind explorers · ${esc(r.explorationLabel || 'Health exploration')}</p></div>
        <p class="headline">${esc(r.summary)}</p>
        <div class="tiles">
          <div class="tile"><div class="tile-label">Your logging adherence</div><div class="tile-value">${r.adherence_comparison?.your_logging_percentage ?? '—'}%</div><div class="tile-note">${esc(r.adherence_comparison?.narrative)}</div></div>
          <div class="tile"><div class="tile-label">Your most effective timing habit</div><div class="tile-value" style="font-size:15px;">${esc(hc.your_top_habit_label || hc.your_top_rule_label || '—')}</div></div>
          <div class="tile"><div class="tile-label">Kind community's top timing habit</div><div class="tile-value" style="font-size:15px;">${esc(hc.kind_community_top_habit_label || hc.kind_community_top_rule_label || '—')}</div></div>
        </div>
      </div>`;
    }

    let html = '';
    for (const r of data.reports) {
      if (r.type === 'BASELINE_SUMMARY') html += renderBaseline(r);
      else if (r.type === 'INTERVENTION_INTERIM') html += renderInterim(r);
      else if (r.type === 'OPTIMISE_COMPLETION') html += renderOptimise(r);
      else if (r.type === 'FINAL_STUDY_COMPLETE') html += renderFinal(data.mobileReport);
      else if (r.type === 'KIND_COMPARISON' || r.type === 'COHORT_COMPARISON') html += renderKindComparison(r);
    }
    root.innerHTML = html;
  </script>
</body>
</html>
