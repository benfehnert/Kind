name: Deploy API

on:
  push:
    branches: [staging, main]
    paths:
      - apps/api/**
      - supabase/migrations/**
      - .github/workflows/api-deploy.yml
  workflow_dispatch:

jobs:
  migrate:
    name: Push DB migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations
        env:
          DB_URL: ${{ github.ref == 'refs/heads/main' && secrets.SUPABASE_DB_URL_PRODUCTION || secrets.SUPABASE_DB_URL_STAGING }}
        run: supabase db push --db-url "$DB_URL"

  # Worker deployment is handled by Cloudflare's GitHub integration.
  # Add a deploy job here only if you disable Cloudflare auto-deploy.
