name: Build and Deploy Web Surfaces

on:
  push:
    branches:
      - main
      - staging
    paths:
      - apps/mobile/**
      - apps/kind-website/**
      - .github/workflows/mobile-web-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed packages
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
            website:
              - 'apps/kind-website/**'

      - name: Prepare output structure
        run: mkdir -p out/app

      - name: Compute base URL
        id: base-url
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "${REPO_NAME}" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            echo "value=/app" >> $GITHUB_OUTPUT
          else
            echo "value=/${REPO_NAME}/app" >> $GITHUB_OUTPUT
          fi

      - name: Restore cached Expo web build
        id: mobile-cache
        uses: actions/cache@v4
        with:
          path: apps/mobile/.web-dist-cache
          key: mobile-web-v3-${{ github.ref_name }}-${{ hashFiles('apps/mobile/**') }}

      - name: Setup Node.js
        if: steps.changes.outputs.mobile == 'true' || steps.mobile-cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.mobile == 'true' || steps.mobile-cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        working-directory: apps/mobile
        run: npm ci --legacy-peer-deps

      - name: Export Expo web build
        if: steps.changes.outputs.mobile == 'true' || steps.mobile-cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        working-directory: apps/mobile
        env:
          BASE_URL: ${{ steps.base-url.outputs.value }}
          EXPO_PUBLIC_API_URL: ${{ github.ref == 'refs/heads/main' && secrets.EXPO_PUBLIC_API_URL_PRODUCTION || secrets.EXPO_PUBLIC_API_URL_STAGING }}
        run: npm run build

      - name: Save exported mobile build for reuse
        if: steps.changes.outputs.mobile == 'true' || steps.mobile-cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        run: |
          rm -rf apps/mobile/.web-dist-cache
          cp -R apps/mobile/dist apps/mobile/.web-dist-cache

      - name: Recover mobile build from cache
        if: steps.changes.outputs.mobile != 'true' && steps.mobile-cache.outputs.cache-hit == 'true' && github.event_name != 'workflow_dispatch'
        run: |
          rm -rf apps/mobile/dist
          cp -R apps/mobile/.web-dist-cache apps/mobile/dist

      - name: Build website
        run: npm run build --prefix apps/kind-website

      - name: Assemble Pages content
        run: |
          cp -R apps/kind-website/dist/. out/
          cp -R apps/mobile/dist/. out/app/
          mkdir -p out/prototype
          cp apps/mobile/prototype.html out/prototype/index.html

      - name: Deploy mobile web to Cloudflare
        working-directory: apps/mobile
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "Skipping Cloudflare deploy: add CLOUDFLARE_API_TOKEN to repository secrets."
            exit 0
          fi
          npx wrangler deploy ${{ github.ref == 'refs/heads/main' && '' || '--env staging' }}

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
