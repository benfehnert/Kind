name: Build and Deploy Web Surfaces

on:
  push:
    branches:
      - main
      - staging
    paths:
      - apps/mobile/**
      - apps/kind-website/**
      - .github/workflows/mobile-web-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "deploy-${{ github.ref_name }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed packages
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
            website:
              - 'apps/kind-website/**'

      - name: Setup Node.js
        if: steps.changes.outputs.mobile == 'true' || steps.changes.outputs.website == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.mobile == 'true' || steps.changes.outputs.website == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        working-directory: apps/mobile
        run: npm ci --legacy-peer-deps

      # Build without BASE_URL so asset paths are root-relative for Cloudflare
      - name: Export Expo web build (Cloudflare)
        if: steps.changes.outputs.mobile == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ github.ref == 'refs/heads/main' && secrets.EXPO_PUBLIC_API_URL_PRODUCTION || secrets.EXPO_PUBLIC_API_URL_STAGING }}
        run: |
          echo "EXPO_PUBLIC_API_URL set: $([ -n "$EXPO_PUBLIC_API_URL" ] && echo "yes (${#EXPO_PUBLIC_API_URL} chars)" || echo "NO - empty or missing")"
          npm run build
          grep -r "localhost:4000" dist/ && echo "WARNING: localhost baked into bundle" || echo "OK: no localhost in bundle"

      - name: Deploy mobile web to Cloudflare
        if: steps.changes.outputs.mobile == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: apps/mobile
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "Skipping Cloudflare deploy: add CLOUDFLARE_API_TOKEN to repository secrets."
            exit 0
          fi
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npx wrangler deploy
          else
            npx wrangler deploy --env staging
          fi

      - name: Build website
        if: steps.changes.outputs.website == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: npm run build --prefix apps/kind-website

      - name: Assemble Pages content
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p out
          cp -R apps/kind-website/dist/. out/

      - name: Setup GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
